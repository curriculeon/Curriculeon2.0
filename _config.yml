# theme: jekyll-theme-cayman
remote_theme: lewismiddleton/cayman-dark
plugins:
  - jekyll-seo-tag
  - jekyll-get-json

# Performance: only rebuild changed files
incremental: true

# Exclude non-content files from the built _site
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - build.sh
  - build.sh.log
  - kill-port.sh
  - serve-application.sh
  - analyze-build.sh
  - python2-runner.bat
  - python3-runner.bat
  - .travis.yml
  - "*.bat"
  - "*.sh"
  - "*.log"
  - target/  
  - courses/public-course-full-stack-java-microservice-export/public-course-full-stack-java-microservice-export.zip_extracted
