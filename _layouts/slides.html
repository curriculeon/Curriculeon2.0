<!doctype html>
<!-- python -m SimpleHTTPServer 8080 -->
<html lang="en">

	<head>
		<meta charset="utf-8">
		<link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/resources/utils/img/favicon.ico?">

		<title>Git-Leon Lecture Template</title>

		<meta name="description" content="A lecture template for reveal.js-based Git-Leon Lessons">
		<meta name="author" content="Git-Leon">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
		<link rel="stylesheet" href="{{ site.baseurl }}/resources/reveal/dist/reveal.css">
		<link rel="stylesheet" href="{{ site.baseurl }}/resources/reveal/dist/theme/black.css" id="theme">
		<link rel="stylesheet" href="{{ site.baseurl }}/resources/reveal/dist/style.css">

		<!-- Code syntax highlighting -->
		<!-- <link rel="stylesheet" href="{{ site.baseurl }}/resources/reveal/lib/css/zenburn.css"> -->

		<!-- fix the inline code block style -->
		<style>
			.reveal code {
				background: #3f3f3f;
				padding: 0px 4px;
			}
		</style>

		<!--[if lt IE 9]>
		<script src="lib/js/html5shiv.js"></script>
		<![endif]-->
	</head>

	<body>

		<div class="reveal">

			<!-- Any section element inside of this container is displayed as a slide -->
			<div class="slides">

				<!-- Intro Slide -->
				<section
					data-markdown
         			data-charset="utf-8">
					 <textarea data-template>
						<img id="logo" src="{{ site.baseurl }}/resources/reveal/img/logo.png" style="max-width: 30%;max-height: 30%;">
						<br/>
						<ul>
							<li>To go to the next section, click the blue arrows at the bottom right corner of this page</li>
						</ul>						
					 </textarea>
				</section>

				<!-- Slides are injected here -->
				<section
					data-markdown
         			data-separator="^<!-- supertopic -->"
         			data-separator-vertical="^<!-- subtopic -->"
         			data-separator-notes="^Note:" 
         			data-charset="utf-8">
					<textarea data-template>
						{{ content }}
					
						<!-- Extro Slide -->
						<img id="logo" src="{{ site.baseurl }}/resources/reveal/img/logo.png" style="max-width: 30%;max-height: 30%;">
						<br/>
						<ul>
							<li>Finished!</li>
						</ul>
					</textarea>
				</section>				
			</div>

		</div>


		<script src="{{ site.baseurl }}/resources/reveal/dist/reveal.js"></script>
        <script src="{{ site.baseurl }}/resources/reveal/plugin/markdown/markdown.js"></script>
        <script src="{{ site.baseurl }}/resources/reveal/plugin/highlight/highlight.js"></script>
        <script src="{{ site.baseurl }}/resources/reveal/plugin/notes/notes.js"></script>
        <script src="{{ site.baseurl }}/resources/reveal/plugin/math/math.js"></script>
		<!-- <script src="{{ site.baseurl }}/resources/reveal/lib/js/head.min.js"></script> -->

		<script>

			// Full list of configuration options available at:
			// https://github.com/hakimel/reveal.js#configuration
			Reveal.initialize({
				controls: true,
				progress: true,
				history: true,
				center: true,

				transition: 'slide', // none/fade/slide/convex/concave/zoom

				// Optional reveal.js plugins
				plugins: [ RevealMarkdown, RevealHighlight ]
			});

		</script>

	</body>
</html>
